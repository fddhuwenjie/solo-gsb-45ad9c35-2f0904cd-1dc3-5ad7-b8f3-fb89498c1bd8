services:
  strata:
    build: .
    image: strata-console:latest
    container_name: strata-console
    ports:
      - "8000:8000"
    volumes:
      - strata-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/state')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  strata-data:
